<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="장기요양 인정절차 현황조회 앱 컨셉 화면">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef6fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f7fc7"/>
      <stop offset="1" stop-color="#165bb6"/>
    </linearGradient>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
      .title{font-size:44px;font-weight:800;fill:#111827}
      .sub{font-size:22px;font-weight:600;fill:#64748b}
      .label{font-size:19px;font-weight:800;fill:#64748b}
      .body{font-size:22px;font-weight:700;fill:#111827}
      .muted{font-size:18px;font-weight:600;fill:#64748b}
      .small{font-size:16px;font-weight:700;fill:#64748b}
      .white{fill:#fff}
      .blueText{fill:#0f66bd}
    </style>
  </defs>
  <rect width="1200" height="820" rx="34" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="96" fill="#fff"/>
  <rect x="0" y="92" width="1200" height="4" fill="#0f7fc7"/>
  <text class="sans title" x="56" y="62">장기요양 인정절차 현황조회</text>
  <text class="sans sub" x="760" y="60">확장 계획 컨셉 화면</text>

  <g filter="url(#shadow)">
    <rect x="62" y="132" width="1076" height="112" rx="24" fill="#fff"/>
    <rect x="96" y="166" width="725" height="52" rx="12" fill="#f8fafc" stroke="#dbe6ef" stroke-width="2"/>
    <text class="sans body" x="126" y="201">인정번호 L123456789</text>
    <rect x="846" y="158" width="248" height="68" rx="16" fill="url(#blue)"/>
    <text class="sans white" x="913" y="202" font-size="26" font-weight="800">조회하기</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="62" y="282" width="430" height="230" rx="24" fill="#fff"/>
    <text class="sans label" x="96" y="325">대상자 조회 결과</text>
    <line x1="96" y1="344" x2="458" y2="344" stroke="#e2e8f0" stroke-width="2"/>
    <text class="sans muted" x="96" y="383">수급자명</text>
    <text class="sans body" x="212" y="383">김건강</text>
    <text class="sans muted" x="96" y="423">보호자명</text>
    <text class="sans body" x="212" y="423">이보호</text>
    <text class="sans muted" x="96" y="463">관할지사</text>
    <text class="sans body" x="212" y="463">대전서부운영센터</text>
    <text class="sans muted" x="96" y="503">문의전화</text>
    <text class="sans body" x="212" y="503">042-123-1234</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="524" y="282" width="614" height="230" rx="24" fill="#fff"/>
    <text class="sans label" x="558" y="325">현재 진행 단계</text>
    <rect x="558" y="356" width="546" height="92" rx="20" fill="#e9f5ff"/>
    <circle cx="612" cy="402" r="27" fill="#0f7fc7"/>
    <text class="sans white" x="601" y="412" font-size="26" font-weight="900">03</text>
    <text class="sans body blueText" x="660" y="392">인정조사</text>
    <text class="sans muted" x="660" y="424">방문 조사 진행 단계</text>
    <text class="sans small" x="558" y="482">다음 단계: 조사완료 → 의사소견서 제출 → 심의자료 선정 → 등급판정 완료</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="62" y="550" width="1076" height="214" rx="24" fill="#fff"/>
    <text class="sans label" x="96" y="594">인정절차 타임라인</text>
    <line x1="142" y1="670" x2="1058" y2="670" stroke="#9ac7e8" stroke-width="8" stroke-linecap="round"/>
    <g>
      <circle cx="142" cy="670" r="28" fill="#0f7fc7"/><text class="sans white" x="130" y="680" font-size="25" font-weight="900">01</text>
      <text class="sans small" x="98" y="732">인정신청 접수</text>
    </g>
    <g>
      <circle cx="295" cy="670" r="28" fill="#0f7fc7"/><text class="sans white" x="282" y="680" font-size="25" font-weight="900">02</text>
      <text class="sans small" x="255" y="732">담당자 지정</text>
    </g>
    <g>
      <circle cx="448" cy="670" r="34" fill="#0f7fc7"/><text class="sans white" x="435" y="681" font-size="28" font-weight="900">03</text>
      <text class="sans body blueText" x="390" y="732">인정조사</text>
    </g>
    <g>
      <circle cx="601" cy="670" r="28" fill="#cbd5e1"/><text class="sans white" x="588" y="680" font-size="25" font-weight="900">04</text>
      <text class="sans small" x="563" y="732">조사완료</text>
    </g>
    <g>
      <circle cx="754" cy="670" r="28" fill="#cbd5e1"/><text class="sans white" x="741" y="680" font-size="25" font-weight="900">05</text>
      <text class="sans small" x="686" y="732">의사소견서 제출</text>
    </g>
    <g>
      <circle cx="907" cy="670" r="28" fill="#cbd5e1"/><text class="sans white" x="894" y="680" font-size="25" font-weight="900">06</text>
      <text class="sans small" x="858" y="732">심의자료 선정</text>
    </g>
    <g>
      <circle cx="1058" cy="670" r="28" fill="#cbd5e1"/><text class="sans white" x="1045" y="680" font-size="25" font-weight="900">07</text>
      <text class="sans small" x="998" y="732">등급판정 완료</text>
    </g>
  </g>
</svg>
