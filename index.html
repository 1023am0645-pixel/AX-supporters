<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI, 현장에 착륙하다 · AX서포터즈 활동 중간보고</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#1f1f1f;
  --cream2:#2d2d2d;
  --ink:#e8ddd0;        /* warm white */
  --green:#a68a6e;      /* muted gold */
  --muted:#d1c6b8;
  --soft:#aaa196;
  --gold:#a68a6e;
  --gold-deep:#8b7355;
  --gold-soft:#3d3530;
  --line:#3a3a3a;
  --line2:#2d2d2d;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth;background:var(--cream);}
body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);background:var(--cream);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;}
::selection{background:var(--gold-soft);}
.serif{font-family:'Noto Serif KR','Pretendard',serif;}

/* progress + nav */
.prog{position:fixed;top:0;left:0;height:3px;width:0;z-index:90;background:var(--gold);}
.dots{position:fixed;right:24px;top:50%;transform:translateY(-50%);z-index:90;display:flex;flex-direction:column;gap:9px;}
.dots button{width:8px;height:8px;border-radius:50%;border:none;padding:0;cursor:pointer;
  background:rgba(23,42,69,.20);transition:.25s;}
.dots button.on{background:var(--gold);transform:scale(1.6);}
.arrows{position:fixed;right:24px;bottom:24px;z-index:90;display:flex;gap:10px;}
.arrows button{width:48px;height:48px;border-radius:50%;border:1px solid rgba(166,138,110,.45);background:rgba(45,45,45,.82);
  color:var(--ink);font-size:18px;cursor:pointer;box-shadow:0 12px 30px -18px rgba(0,0,0,.75);transition:.2s;backdrop-filter:blur(8px);}
.arrows button:hover{background:var(--ink);border-color:var(--gold);color:var(--cream2);box-shadow:0 14px 36px -16px rgba(0,0,0,.9);}

/* section base */
.sec{position:relative;min-height:100vh;width:100%;scroll-snap-align:start;
  display:flex;flex-direction:column;justify-content:center;padding:16vh 12vw;}
.wrap{width:100%;max-width:1080px;margin:0 auto;}
.folio{position:absolute;top:5vh;left:8vw;right:8vw;display:flex;justify-content:space-between;
  font-size:15px;letter-spacing:.08em;color:var(--soft);text-transform:uppercase;}
.rv{opacity:0;transform:translateY(34px);transition:.9s cubic-bezier(.2,.7,.15,1);}
.rv.in{opacity:1;transform:none;}
.d1{transition-delay:.1s}.d2{transition-delay:.2s}.d3{transition-delay:.3s}.d4{transition-delay:.4s}.d5{transition-delay:.5s}.d6{transition-delay:.6s}

.kick{font-size:16px;letter-spacing:.16em;font-weight:700;color:var(--gold);text-transform:uppercase;margin-bottom:28px;}
.ey{font-size:16px;letter-spacing:.06em;font-weight:700;color:var(--green);margin-bottom:22px;}
.big{font-family:'Noto Serif KR',serif;font-weight:700;color:var(--ink);line-height:1.3;letter-spacing:-.015em;}
.big .g{color:var(--gold-deep);}
.big .gr{color:var(--green);}
.note{font-size:14px;color:var(--muted);line-height:1.75;}
.tiny{font-size:15px;color:var(--soft);letter-spacing:.03em;}

/* OPENING */
#s0{justify-content:center;background:
  radial-gradient(120% 90% at 80% 10%,rgba(166,138,110,.08),transparent 55%),var(--cream);}
#s0{cursor:pointer;}
#s0 .line{font-family:'Noto Serif KR',serif;font-size:clamp(40px,5.3vw,76px);font-weight:700;
  color:var(--ink);line-height:1.5;}
#s0 .opening-title{min-height:1.5em;opacity:0;letter-spacing:.01em;}
#s0 .opening-title.visible{opacity:1;}
#s0 .opening-title.typing::after{content:"";display:inline-block;width:.07em;height:.9em;margin-left:.08em;
  background:var(--gold);vertical-align:-.08em;animation:cursorBlink .75s step-end infinite;}
@keyframes cursorBlink{50%{opacity:0;}}
#s0 .line.dim{color:var(--soft);}
#s0 .line.hl{color:var(--gold-deep);}
.startbtn{margin-top:48px;display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--cream2);
  border:none;border-radius:40px;padding:15px 34px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:'Pretendard',sans-serif;box-shadow:0 12px 30px -12px rgba(23,42,69,.6);transition:.2s;}
.startbtn:hover{background:var(--green);transform:translateY(-2px);}
.startbtn:disabled{opacity:.82;cursor:default;transform:none;}
.startbtn .a{color:var(--gold);}
#s0 .startbtn{position:absolute;left:50%;bottom:12vh;margin-top:0;transform:translateX(-50%);}
#s0 .startbtn:hover{transform:translate(-50%,-2px);}
#s0 .startbtn:disabled{transform:translateX(-50%);}

/* COVER */
#s1{justify-content:space-between;background:
  radial-gradient(130% 80% at 85% -10%,rgba(166,138,110,.1),transparent 55%),var(--cream);padding:16vh 12vw;}
#s1 .top{font-size:15px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;}
#s1 h1{font-family:'Noto Serif KR',serif;font-size:clamp(28px,6vw,72px);font-weight:900;
  line-height:1.08;letter-spacing:-.03em;color:var(--ink);}
#s1 h1 .dot{color:var(--gold);}
#s1 .sub{margin:0 0 18px;font-size:clamp(21px,2.4vw,30px);color:var(--green);font-weight:600;text-align:right;}
#s1 .foot{border-top:1px solid var(--line);padding-top:24px;font-size:15px;color:var(--muted);letter-spacing:.02em;}

/* SPOILER */
.spoiler-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);margin-top:14px;}
.spoiler-grid .it{padding:32px 36px;border-bottom:1px solid var(--line);}
.spoiler-grid .it:nth-child(odd){border-right:1px solid var(--line);}
.spoiler-grid .it .tg{display:inline-block;font-size:14px;letter-spacing:.08em;font-weight:700;color:var(--gold-deep);
  background:var(--gold-soft);padding:5px 14px;border-radius:20px;margin-bottom:14px;}
.spoiler-grid .it h3{font-family:'Noto Serif KR',serif;font-size:23px;font-weight:700;color:var(--ink);margin-bottom:9px;line-height:1.45;white-space:pre-line;}
.spoiler-grid .it p{font-size:15.5px;color:var(--muted);line-height:1.7;}
.spoiler-title{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:clamp(22px,3vw,36px);font-weight:800;color:var(--gold-deep);letter-spacing:0;text-transform:none;margin-bottom:22px;}

/* keyword pills */
.kws{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
.kws span{font-size:14px;font-weight:600;color:var(--ink);background:var(--cream2);
  border:1px solid var(--line);border-radius:30px;padding:9px 18px;}
.kws span.k-gold{background:var(--gold-soft);border-color:#E6D29A;color:var(--gold-deep);}

/* galleries */
.galwrap{margin-top:10px;}
.gallabel{font-size:15px;letter-spacing:.08em;font-weight:700;color:var(--green);text-transform:uppercase;margin:0 0 18px;}
.gal{display:grid;gap:24px;}
.gal.photos{grid-template-columns:repeat(2,1fr);}
.gal.app{grid-template-columns:repeat(4,1fr);}
.gal.wide{grid-template-columns:repeat(2,1fr);}
.gal.pair2x2{grid-template-columns:repeat(2,1fr);gap:18px 24px;}
.gal.one{grid-template-columns:1fr;max-width:640px;}
figure{margin:0;}
.frame{position:relative;width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:var(--cream2);display:flex;align-items:center;justify-content:center;}
.frame.r43{aspect-ratio:4/3;}
.frame.r169{aspect-ratio:16/9;}
.frame.rphoto{aspect-ratio:6048/4024;}
.frame.r916{aspect-ratio:9/16;}
.frame.rapp{aspect-ratio:970/1406;}
.frame.r1610{aspect-ratio:16/10;}
.frame.rbook{aspect-ratio:5/7;}
.frame img{width:100%;height:100%;object-fit:cover;display:block;}
.frame.book-frame img{object-fit:contain;background:var(--cream2);}
.gal.pair2x2 .frame img{object-fit:contain;background:var(--cream2);}
.frame .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border:1px dashed #D8CDB3;border-radius:10px;background:repeating-linear-gradient(135deg,#FBF7EE,#FBF7EE 12px,#F6F0E2 12px,#F6F0E2 24px);
  color:var(--soft);text-align:center;padding:14px;}
.frame .ph .pi{font-size:22px;opacity:.6;}
.frame .ph .pt{font-size:13px;letter-spacing:.12em;font-weight:700;color:#B6AD96;}
.img-upload{position:absolute;right:10px;bottom:10px;z-index:3;border:1px solid rgba(166,138,110,.5);
  background:rgba(31,31,31,.72);color:var(--ink);border-radius:22px;padding:8px 12px;
  font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;font-size:12px;font-weight:700;cursor:pointer;
  opacity:.72;backdrop-filter:blur(8px);transition:.2s;}
.frame:hover .img-upload,.img-upload:focus{opacity:1;background:var(--ink);color:var(--cream2);}
.frame.has-image .img-upload{display:none;}
figcaption{margin-top:12px;font-size:15px;color:var(--muted);letter-spacing:.01em;text-align:center;}

/* lecture overview */
.lecture-overview{max-width:1220px;margin:0 auto;}
.overview-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;}
.overview-card{min-height:210px;padding:30px 26px;border:1px solid var(--line);border-radius:8px;background:rgba(45,45,45,.56);
  display:flex;flex-direction:column;}
.overview-card .n{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:800;color:var(--gold);}
.overview-card h3{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:clamp(18px,1.8vw,25px);
  font-weight:800;color:var(--ink);letter-spacing:0;margin-top:18px;}
.overview-card p{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:clamp(15px,1.2vw,18px);
  font-weight:600;color:var(--muted);line-height:1.7;word-break:keep-all;white-space:pre-line;margin-top:20px;}

/* reviews */
.reviews{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px;}
.review{border-left:4px solid var(--gold);background:var(--cream2);border-radius:0 12px 12px 0;padding:22px 24px;}
.review p{font-family:'Noto Serif KR',serif;font-size:17px;color:var(--ink);line-height:1.65;}
.review .by{margin-top:12px;font-size:14px;color:var(--soft);letter-spacing:.03em;}
#s5c{padding-top:9vh;padding-bottom:7vh;}
#s5d{padding-top:10vh;padding-bottom:8vh;}
.review-showcase{display:block;max-width:1400px;margin:4px auto 0;}
.survey-proof{border:1px solid var(--line);border-radius:10px;background:rgba(45,45,45,.52);padding:18px;margin-bottom:18px;}
.survey-proof-head{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:13px;font-weight:800;color:var(--gold);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;}
.difficulty-summary{border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:12px 0;margin-bottom:12px;}
.difficulty-title{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:13px;font-weight:800;color:var(--ink);margin-bottom:8px;}
.difficulty-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:5px 0;
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:12.5px;color:var(--muted);}
.difficulty-row strong{color:var(--gold);font-weight:800;}
.survey-proof-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.proof-link{display:block;color:inherit;text-decoration:none;}
.proof-shot{position:relative;aspect-ratio:16/9;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#f3f3f3;}
.proof-shot img{width:100%;height:100%;object-fit:contain;object-position:center top;display:block;}
.proof-caption{margin-top:12px;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;font-weight:400;color:var(--muted);text-align:center;}
.review-lines{display:grid;gap:18px;max-width:1280px;margin:0 auto;}
.review-line{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;border:1px solid var(--line);border-radius:8px;
  background:rgba(31,31,31,.62);padding:24px 28px;}
.review-line .n{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:800;color:var(--gold);}
.review-line p{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:clamp(16px,1.45vw,22px);
  font-weight:700;color:var(--ink);line-height:1.52;word-break:keep-all;}
.review-line .q{color:var(--gold);font-family:'Noto Serif KR',serif;font-size:1.08em;font-weight:900;}
.review-line .hi{color:var(--gold);font-size:calc(1em + 2pt);font-weight:900;}
.review-footnote{margin-top:16px;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:13px;color:var(--soft);
  letter-spacing:.03em;text-align:right;}
#s5d{padding-top:7vh;padding-bottom:5vh;}
#s5d .wrap{max-width:1280px;}
#s5d .review-lines{gap:12px;max-width:992px;}
#s5d .review-line{gap:14px;padding:16px 22px;border-radius:8px;}
#s5d .review-line .n{font-size:16px;}
#s5d .review-line p{font-family:'Batang','바탕','Noto Serif KR',serif;font-style:italic;font-size:clamp(14px,1.16vw,18px);line-height:1.5;font-weight:500;color:#eee4d7;}
#s5d .review-line .q{font-family:'Batang','바탕','Noto Serif KR',serif;font-style:italic;font-size:1.1em;font-weight:600;}
#s5d .review-line .hi{font-size:1.05em;font-weight:700;color:#c9a86a;}
#s5d .review-footnote{margin-top:12px;font-size:12px;}

/* why-app */
#s7{padding-top:10vh;padding-bottom:8vh;}
#s8{padding:8vh 5vw 6vh;}
#s10c{padding-top:10vh;padding-bottom:8vh;}
.book-proof{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;}
.book-proof .frame{box-shadow:0 18px 42px -30px rgba(0,0,0,.65);}
.book-pain-title{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;font-size:clamp(18px,2vw,26px);font-weight:800;
  color:var(--gold);margin:40px 0 14px;line-height:1.35;text-align:left;display:flex;align-items:center;gap:10px;}
.book-pain-title::before{content:"◆";font-size:.72em;color:var(--gold);line-height:1;}
.pains{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0;}
.pain-title{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;font-size:clamp(18px,2.2vw,28px);font-weight:800;
  color:var(--gold);margin:82px 0 18px;line-height:1.35;}
.pains .p{flex:1;padding:28px 22px;text-align:center;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:clamp(18px,2.4vw,28px);
  font-weight:700;color:var(--ink);line-height:1.35;white-space:pre-line;}
.book-pains .p{padding:16px 14px;font-size:clamp(15px,1.7vw,21px);}
.book-pains .p:nth-child(1),.book-pains .p:nth-child(2){display:flex;align-items:center;justify-content:center;}
.pains .p.small{font-size:clamp(16px,2vw,23px);}
.pains .p + .p{border-left:1px solid var(--line);}
.bridge{font-size:clamp(17px,2vw,23px);color:var(--green);font-weight:600;margin:10px 0 28px;line-height:1.4;}
.effects{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);}
.effects .e{padding:28px 26px;border-left:1px solid var(--line2);}
.effects .e:first-child{border-left:none;padding-left:0;}
.effects .e .n{font-family:'Noto Serif KR',serif;font-size:18px;color:var(--gold);margin-bottom:9px;font-weight:700;}
.effects .e h4{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:21px;font-weight:700;color:var(--ink);margin-bottom:8px;line-height:1.45;}
.effects .e p{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:16px;color:var(--muted);line-height:1.7;}
.app-preview-wrap{position:relative;max-width:1500px;}
.app-preview-wrap .intro{margin-bottom:20px;}
.app-preview-wrap .intro .ey{margin-bottom:14px;}
.app-preview-wrap .galwrap{margin-top:4px;}
.app-preview-wrap .gal.app{max-width:1500px;margin:0 auto;gap:22px;}
.app-preview-wrap .frame img{object-fit:contain;background:#EEF5FF;}
.app-preview-wrap figcaption{display:none;}
.app-preview-wrap .app-action{position:absolute;right:0;top:0;margin-top:0;}
.practice-wrap .frame img{object-fit:contain;background:var(--cream2);}

/* app expansion plan */
#s8b,#s8c{padding:7vh 6vw 5vh;}
#s8b .wrap,#s8c .wrap{max-width:1100px;}
.expansion-head{margin-bottom:30px;}
.expansion-head .ey{margin-bottom:10px;}.expansion-head .ey:empty{display:none;}
.expansion-head .big{font-size:clamp(30px,4vw,54px);margin-bottom:24px;}
.expansion-sub{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:clamp(15px,1.2vw,18px);
  font-weight:600;color:var(--muted);line-height:1.6;white-space:pre-line;}
.expansion-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.extension-card{border:1px solid var(--line);border-radius:12px;background:rgba(45,45,45,.56);
  padding:18px;box-shadow:0 18px 50px -42px rgba(0,0,0,.9);}
.extension-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px;}
.extension-card h3{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:clamp(20px,1.75vw,27px);
  font-weight:800;color:var(--ink);line-height:1.3;letter-spacing:0;}
.extension-badge{flex:0 0 auto;border:1px solid rgba(166,138,110,.42);border-radius:999px;padding:7px 12px;
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:12px;font-weight:800;color:var(--gold);
  background:rgba(166,138,110,.1);white-space:nowrap;}
.extension-desc{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:clamp(14px,1.05vw,16px);
  color:var(--muted);font-weight:600;line-height:1.6;white-space:pre-line;margin-bottom:12px;}
.extension-images{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:12px;margin-top:10px;}
.extension-shot .frame{display:block;width:100%;height:auto;aspect-ratio:auto;border-radius:10px;background:#f7f8fb;overflow:hidden;}
.extension-shot .frame img{display:block;width:100%;height:auto;background:#f7f8fb;}
.extension-card.status .extension-images{grid-template-columns:1fr;}
.extension-card.status .extension-shot{max-width:480px;margin:0 auto;width:100%;}
.extension-shot figcaption{display:none;margin-top:8px;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  font-size:12.5px;color:var(--soft);font-weight:600;}
.extension-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;}
.extension-tags span{border:1px solid rgba(166,138,110,.28);border-radius:999px;padding:6px 10px;
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:12.5px;font-weight:700;color:var(--ink);
  background:rgba(31,31,31,.52);}
.extension-footer{margin-top:18px;text-align:center;font-family:'Noto Serif KR',serif;font-size:clamp(17px,1.7vw,24px);
  font-weight:600;color:var(--gold);line-height:1.6;white-space:pre-line;}
#s8b{padding-top:6vh;padding-bottom:4vh;}
#s8b .wrap{max-width:1180px;}
#s8b .expansion-head{margin-bottom:18px;}
#s8b .expansion-head .big{font-size:clamp(28px,3.7vw,48px);margin-bottom:14px;}
#s8b .expansion-sub{line-height:1.45;}
#s8b .extension-card{padding:14px 16px;}
#s8b .extension-card-head{margin-bottom:8px;}
#s8b .extension-desc{line-height:1.45;margin-bottom:8px;}
#s8b .extension-images{gap:10px;margin-top:8px;}

#s8b .extension-shot figcaption{margin-top:6px;font-size:12px;}
#s8b .extension-tags{margin-top:10px;gap:6px;}
#s8b .extension-tags span{padding:5px 9px;font-size:12px;}
#s5a,#s5b{padding-left:7vw;padding-right:7vw;}
#s5a .wrap,#s5b .wrap{max-width:1320px;}
#s5b .wrap{max-width:1120px;}
#s5a .gal.pair2x2{gap:18px 24px;max-width:972px;margin:0 auto;}
#s5a .ey{width:min(972px,100%);margin:0 auto 24px;text-align:left;}
.practice-feature-grid{display:grid;grid-template-columns:1.08fr .92fr;grid-template-rows:auto auto;gap:18px;max-width:1260px;margin:12px auto 0;}

/* keep dense image pages inside the presentation viewport */

#s5b .wrap{display:flex;flex-direction:column;align-items:center;}
#s5b .ey{width:min(1000px,100%);margin:0 auto 24px;text-align:left;}
#s5a .gal.pair2x2 .frame{height:auto;aspect-ratio:16/9;}

#s5b .practice-feature-grid{grid-template-rows:1fr 1fr;width:min(1040px,100%);max-width:1040px;height:min(46vh,420px);gap:14px;margin:0 auto;}

#s7 .book-pain-title{margin:24px 0 10px;font-size:clamp(16px,1.6vw,22px);}

/* app open button */

/* studio */
.studio-grid{display:grid;grid-template-columns:.95fr 1.05fr;gap:6vw;align-items:center;}
.problist{list-style:none;}
.problist li{padding:18px 0;border-top:1px solid var(--line2);font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:17px;color:var(--muted);display:flex;gap:14px;line-height:1.65;}

.manages{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}
.manages span{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;font-weight:700;color:var(--cream2);background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);border-radius:30px;padding:8px 16px;}
.assist{margin-top:24px;border-top:1px solid var(--line);padding-top:20px;}
.assist .a-lab{font-size:14px;letter-spacing:.12em;font-weight:700;color:var(--gold-deep);text-transform:uppercase;margin-bottom:10px;}

.studio-reason-shot .frame{box-shadow:0 18px 42px -30px rgba(0,0,0,.65);}

#s10c .studio-work{grid-template-columns:.9fr 1.15fr;gap:5vw;}
#s10c .studio-work .frame{height:clamp(360px,44vh,500px);aspect-ratio:auto;}
.studio-brand{letter-spacing:.04em;font-weight:900;}
.purpose-pills{display:flex;flex-direction:column;gap:10px;}
.purpose-pills span{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:clamp(16px,1.65vw,21px);

#sEnd .ep-eyebrow{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  font-size:12px;letter-spacing:.42em;font-weight:600;color:#b08d52;text-transform:uppercase;
  margin-bottom:clamp(28px,5vh,46px);padding-left:.42em;}
#sEnd .ep-lead{font-family:'Noto Serif KR',serif;font-weight:300;word-break:keep-all;overflow-wrap:normal;

#sEnd .ep-focal{font-family:'Noto Serif KR',serif;font-weight:500;word-break:keep-all;overflow-wrap:normal;
  font-size:clamp(23px,3vw,34px);line-height:1.55;letter-spacing:-.01em;color:#ece2d6;margin-bottom:clamp(44px,6.5vh,64px);}
#sEnd .ep-hl{color:#c9a86a;font-weight:600;}
#sEnd .ep-rule{width:38px;height:1px;background:#b08d52;opacity:.55;margin:0 auto clamp(40px,6vh,60px);}
#sEnd .ep-tail{font-family:'Noto Serif KR',serif;font-weight:300;word-break:keep-all;overflow-wrap:normal;
  font-size:clamp(15px,1.55vw,19px);line-height:1.9;color:#b8afa1;}
#sEnd .ep-lead{transition-delay:.35s;}
#sEnd .ep-focal{transition-delay:1.15s;}
#sEnd .ep-rule{transition-delay:1.65s;}
#sEnd .ep-tail{transition-delay:2.15s;}

/* final */
#sFinal{justify-content:center;text-align:center;background:
  radial-gradient(120% 90% at 50% 0%,rgba(166,138,110,.12),transparent 58%),var(--cream);}
#sFinal .final-copy{font-family:'Noto Serif KR',serif;font-size:clamp(42px,6.2vw,82px);font-weight:900;color:var(--ink);
  line-height:1.18;letter-spacing:-.02em;word-break:keep-all;min-height:1.25em;}
#sFinal .final-copy.typing::after{content:"";display:inline-block;width:.07em;height:.84em;margin-left:.08em;
  background:var(--gold);vertical-align:-.06em;animation:cursorBlink .75s step-end infinite;}
#sFinal .final-meta{margin-top:78px;opacity:0;transform:translateY(58px);
  transition:opacity 1.85s ease,transform 2.25s cubic-bezier(.2,.7,.15,1);}

#sFinal .final-title{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:clamp(22px,2.7vw,34px);font-weight:700;color:var(--ink);

#sFinal .final-title .g{color:var(--gold-deep);}
#sFinal .final-sub{margin-top:18px;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;

@media(max-width:820px){
  .sec{padding:16vh 9vw;}
  .spoiler-grid{grid-template-columns:1fr;}
  .spoiler-grid .it:nth-child(odd){border-right:none;}
  .gal.photos,.gal.app,.gal.wide{grid-template-columns:1fr 1fr;}
  .overview-grid{grid-template-columns:1fr;gap:12px;}
  .overview-card{min-height:auto;padding:22px 20px;}
  .reviews{grid-template-columns:1fr;}
  .review-showcase{display:block;}
  .survey-proof-grid{grid-template-columns:1fr;}
  .review-line{grid-template-columns:1fr;gap:8px;}
  .practice-feature-grid{grid-template-columns:1fr;grid-template-rows:auto;max-width:100%;}
  .practice-feature-grid .left-top,.practice-feature-grid .left-bottom,.practice-feature-grid .right-tall{grid-column:auto;grid-row:auto;}
  .practice-feature-grid .right-tall .frame{aspect-ratio:16/9;height:auto;}
  .pains{flex-direction:column;}.pains .p + .p{border-left:none;border-top:1px solid var(--line);}
  .effects{grid-template-columns:1fr;}.effects .e{border-left:none;padding-left:0;border-top:1px solid var(--line2);}
  .studio-grid{grid-template-columns:1fr;gap:34px;}

  .studio-reason-layout{grid-template-columns:1fr;gap:28px;}

@media print{html{scroll-snap-type:none;}.sec{page-break-after:always;min-height:auto;}.dots,.arrows,.prog{display:none;}}

</head>
<body>
<div class="prog" id="prog"></div>
<nav class="dots" id="dots"></nav>
<div class="arrows"><button id="prev" aria-label="이전">↑</button><button id="next" aria-label="다음">↓</button></div>
<main id="app"></main>

<script src="content_revision.js"></script>
<script>
const C = (typeof CONTENT !== 'undefined') ? CONTENT : (window.CONTENT || {});
const app = document.getElementById('app');
const esc = s => String(s==null?"":s);

/* image frame with graceful placeholder */
function frame(item, ratio){
  const f = document.createElement('figure');
  const fr = document.createElement('div'); fr.className = 'frame '+ratio;
  const img = document.createElement('img');
  const src = esc(item.src||'');
  const storeKey = src ? 'ax-webbook-image:'+src : '';
  const savedSrc = storeKey ? localStorage.getItem(storeKey) : '';
  img.alt = esc(item.caption||'');
  img.onload = ()=>{
    fr.classList.add('has-image');
    img.style.display='block';
    fr.querySelectorAll('.ph').forEach(p=>p.remove());
  };
  img.onerror = ()=>{
    if(savedSrc && img.src === savedSrc && src){
      if(storeKey) localStorage.removeItem(storeKey);
      img.src = src;
      return;
    }
    fr.classList.remove('has-image');
    img.style.display='none';
    if(!fr.querySelector('.ph')){
      const ph = document.createElement('div'); ph.className='ph';
      ph.innerHTML = '<div class="pi">▣</div><div class="pt">IMAGE</div>';
      fr.appendChild(ph);
    }
  };
  img.src = savedSrc || src;
  const input=document.createElement('input');
  input.type='file'; input.accept='image/*'; input.style.display='none';
  const upload=document.createElement('button');
  upload.type='button'; upload.className='img-upload'; upload.textContent='이미지 넣기';
  upload.onclick=e=>{ e.preventDefault(); e.stopPropagation(); input.click(); };
  input.onchange=()=>{
    const file=input.files && input.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      const data=String(reader.result||'');
      if(storeKey) localStorage.setItem(storeKey,data);
      fr.classList.add('has-image');
      img.style.display='block';
      img.src=data;
      fr.querySelectorAll('.ph').forEach(p=>p.remove());
    };
    reader.readAsDataURL(file);
  };
  fr.appendChild(img); fr.appendChild(input); fr.appendChild(upload); f.appendChild(fr);
  if(item.caption){ const cap=document.createElement('figcaption'); cap.textContent=item.caption; f.appendChild(cap); }
  return f;
}
function gallery(list, ratio, klass, label){
  const w = document.createElement('div'); w.className='galwrap rv d2';
  if(label){ const l=document.createElement('div'); l.className='gallabel'; l.textContent=label; w.appendChild(l); }
  const g = document.createElement('div'); g.className='gal '+klass;
  (list||[]).forEach(it=> g.appendChild(frame(it, ratio)));
  w.appendChild(g); return w;
}
function pairedGallery(list, ratio, label){
  const w = document.createElement('div'); w.className='galwrap rv d2';
  if(label){ const l=document.createElement('div'); l.className='gallabel'; l.textContent=label; w.appendChild(l); }
  const g = document.createElement('div'); g.className='gal pair2x2';
  (list||[]).slice(0,4).forEach((it,i)=>{
    g.appendChild(frame(it, ratio));
  });
  w.appendChild(g); return w;
}
function bigLines(arr, cls){
  return '<h2 class="'+(cls||'big')+'">'+ (arr||[]).map(esc).join('<br>') +'</h2>';
}

/* build a section element */
function section(id, builder, folioL, folioR){
  const s = document.createElement('section'); s.className='sec'; if(id) s.id=id;
  if(folioL!=null){ const fo=document.createElement('div'); fo.className='folio';
    fo.innerHTML='<span>'+esc(folioL)+'</span><span>'+esc(folioR||'')+'</span>'; s.appendChild(fo); }
  const w = document.createElement('div'); w.className='wrap'; builder(w,s); s.appendChild(w);
  app.appendChild(s); return s;
}

/* ───── 00 OPENING ───── */
section('s0', (w,s)=>{
  const o=C.opening||{};
  const titleText = (o.lines||[])[0] || '';
  const p=document.createElement('p');
  p.className='line opening-title';
  p.setAttribute('aria-live','polite');
  w.appendChild(p);
  const b=document.createElement('button'); b.className='startbtn rv d4';
  b.innerHTML=esc(o.button||'발표 시작')+' <span class="a">→</span>';
  let started=false;
  let ready=false;
  const handleOpeningAction=()=>{
    if(ready){
      document.getElementById('s1').scrollIntoView({behavior:'smooth'});
      return;
    }
    if(started) return;
    started=true;
    s.dataset.openingStarted='1';
    b.disabled=true;
    p.classList.add('visible','typing');
    let i=0;
    const tick=()=>{
      p.textContent=titleText.slice(0,i);
      i += 1;
      if(i<=titleText.length){
        setTimeout(tick,85);
      }else{
        p.classList.remove('typing');
        ready=true;
        s.dataset.openingReady='1';
        b.disabled=false;
        b.innerHTML='NEXT <span class="a">→</span>';
      }
    };
    tick();
  };
  window.openingAdvance=handleOpeningAction;
  window.openingReady=()=>ready;
  b.onclick=e=>{
    e.preventDefault();
    e.stopPropagation();
    handleOpeningAction();
  };
  s.addEventListener('click', e=>{
    if(e.target.closest('.startbtn')) return;
    handleOpeningAction();
  });
  w.appendChild(b);
});

/* ───── 01 COVER ───── */
section('s1', w=>{
  const c=C.cover||{};
  if(c.top){ const top=document.createElement('div'); top.className='top rv'; top.textContent=esc(c.top); w.appendChild(top); }
  const mid=document.createElement('div'); mid.style.flex='1'; mid.style.display='flex'; mid.style.flexDirection='column'; mid.style.justifyContent='center';
  mid.innerHTML='<h1 class="rv d1">'+esc(c.title)+'</h1>';
  w.appendChild(mid);
  const sub=document.createElement('div'); sub.className='sub rv d2'; sub.textContent=esc(c.sub); w.appendChild(sub);
  const foot=document.createElement('div'); foot.className='foot rv d3'; foot.textContent=esc(c.foot); w.appendChild(foot);
  w.style.height='78vh'; w.style.display='flex'; w.style.flexDirection='column'; w.style.justifyContent='space-between';
}, '', '');

/* ───── 02 SPOILER ───── */
section('s2', w=>{
  const sp=C.spoiler||{};
  w.innerHTML='<h2 class="big rv d1 spoiler-title" style="font-size:clamp(22px,3vw,36px);margin-bottom:28px;">'+esc(sp.title)+'</h2>';
  const grid=document.createElement('div'); grid.className='spoiler-grid rv d2';
  (sp.items||[]).forEach(it=>{
    const d=document.createElement('div'); d.className='it';
    d.innerHTML='<span class="tg">'+esc(it.tag)+'</span><h3>'+esc(it.title)+'</h3><p>'+esc(it.note)+'</p>';
    grid.appendChild(d);
  });
  w.appendChild(grid);
}, '오늘의 미리보기', '02');

/* ───── 03 LECTURE CHAPTER ───── */
section('s3', w=>{
  const l=C.lectureChapter||{};
  w.innerHTML='<div class="kick rv">'+esc(l.kicker)+'</div>'+
    bigLines(l.big).replace('class="big"','class="big rv d1" style="font-size:clamp(30px,5vw,58px)"');
  const k=document.createElement('div'); k.className='kws rv d3'; k.style.marginTop='34px';
  (l.keywords||[]).forEach((kw,i)=>{ const s=document.createElement('span'); if(i<2)s.className='k-gold'; s.textContent=kw; k.appendChild(s); });
  w.appendChild(k);
}, 'PART 1 · 지정과제', '03');

/* ───── 04 LECTURE OVERVIEW ───── */
section('s4', w=>{
  const o=C.lectureOverview||{};
  w.classList.add('lecture-overview');
  w.innerHTML=bigLines(o.title||['설명하는 강의보다,','직접 써보는 강의를 만들었습니다.'])
    .replace('class="big"','class="big rv d1" style="font-size:clamp(28px,4.2vw,52px);margin-bottom:46px;"');
  const grid=document.createElement('div'); grid.className='overview-grid rv d2';
  (o.items||[]).forEach((it,i)=>{
    const card=document.createElement('div'); card.className='overview-card';
    const lines=Array.isArray(it.text)?it.text:[it.text||''];
    card.innerHTML='<div class="n">0'+(i+1)+'</div><h3>'+esc(it.label||'')+'</h3><p>'+esc(lines.join('\n'))+'</p>';
    grid.appendChild(card);
  });
  w.appendChild(grid);
}, 'PART 1 · 강의 개요', '04');

/* ───── 05 MATERIALS + PRACTICE + REVIEWS ───── */
section('s5a', w=>{
  w.innerHTML='<div class="ey rv">AI 특강 교안</div>';
  if((C.lectureMaterials||[]).length) w.appendChild(pairedGallery(C.lectureMaterials,'r169'));
}, 'PART 1 · 교육자료', '05-1');

section('s5b', w=>{
  w.classList.add('practice-wrap');
  w.innerHTML='<div class="ey rv">실습 결과물 및 공유자료</div>';
  const list=C.lecturePractice||[];
  if(list.length){
    const grid=document.createElement('div'); grid.className='practice-feature-grid rv d2';
    if(list[0]){ const fig=frame(list[0],'r169'); fig.classList.add('left-top'); grid.appendChild(fig); }
    if(list[1]){ const fig=frame(list[1],'r169'); fig.classList.add('left-bottom'); grid.appendChild(fig); }
    if(list[2]){ const fig=frame(list[2],'r169'); fig.classList.add('right-tall'); grid.appendChild(fig); }
    w.appendChild(grid);
  }
}, 'PART 1 · 교육자료', '05-2');

/* ───── LECTURE PHOTOS ───── */
const photoSections = C.lecturePhotoSections || [];
section('s4a', w=>{
  const p = photoSections[0] || {};
  w.innerHTML='<div class="ey rv">'+esc(p.title||'AI 특강 현장')+'</div>';
  if((p.images||[]).length) w.appendChild(gallery(p.images,'rphoto','photos'));
}, 'PART 1 · 강의 스케치', '05-3');

section('s4b', w=>{
  const p = photoSections[1] || {};
  w.innerHTML='<div class="ey rv">'+esc(p.title||'AI 특강 현장')+'</div>';
  if((p.images||[]).length) w.appendChild(gallery(p.images,'rphoto','photos'));
}, 'PART 1 · 강의 스케치', '05-4');

section('s5c', w=>{
  w.innerHTML='<div class="ey rv">강의 후기</div>';
  const wrap=document.createElement('div'); wrap.className='review-showcase rv d2';
  const proof=document.createElement('div'); proof.className='survey-proof';

section('s5d', w=>{
  w.innerHTML='<div class="ey rv">대표 후기</div>';
  const lines=document.createElement('div'); lines.className='review-lines rv d2';
  const escapeReg=v=>String(v).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const addSentenceBreaks=txt=>String(txt||'').replace(/([.!?,]+)\s*/g,'$1\n').trim();
  const markReview=(txt,phrases=[])=>{
    txt=addSentenceBreaks(txt);
    const list=[...phrases].sort((a,b)=>b.length-a.length);
    if(!list.length) return esc(txt).replace(/\n/g,'<br>');
    const pattern=new RegExp('('+list.map(escapeReg).join('|')+')','g');
    return String(txt||'').split(pattern).map(part=>
      list.includes(part)?'<span class="hi">'+esc(part)+'</span>':esc(part).replace(/\n/g,'<br>')
    ).join('');
  };
  (C.lectureReviewCards||[]).forEach((txt,i)=>{
    const row=document.createElement('div'); row.className='review-line';
    const phrases=(C.lectureReviewHighlights||[])[i]||[];
    row.innerHTML='<div class="n">0'+(i+1)+'</div><p><span class="q">“</span>'+markReview(txt,phrases)+'<span class="q">”</span></p>';
    lines.appendChild(row);

/* ───────── NAV / REVEAL ───────── */
const secs=[...document.querySelectorAll('.sec')];
const prog=document.getElementById('prog');
const dots=document.getElementById('dots');
function blockOpeningAdvance(){
  if(cur===0 && window.openingReady && !window.openingReady()){
    if(window.openingAdvance) window.openingAdvance();
    return true;
  }
  return false;
}
secs.forEach((s,i)=>{ const b=document.createElement('button'); b.onclick=()=>{
  if(i>0 && blockOpeningAdvance()) return;
  s.scrollIntoView({behavior:'smooth'});
}; dots.appendChild(b); });
const dotEls=[...dots.children];
let cur=0;
function runFinalType(sec){
  const el=sec.querySelector('.final-copy');
  if(!el || el.dataset.done==='1') return;
  const text=el.dataset.finalCopy || '';
  el.textContent='';
  el.classList.add('typing');
  let i=0;
  const tick=()=>{
    el.textContent=text.slice(0,i);
    i += 1;
    if(i<=text.length){
      setTimeout(tick,85);
    }else{
      el.classList.remove('typing');
      el.dataset.done='1';
      setTimeout(()=>sec.classList.add('final-ready'),850);
    }
  };
  tick();
}
const io=new IntersectionObserver(es=>{es.forEach(en=>{
  if(en.isIntersecting){
    en.target.querySelectorAll('.rv').forEach(r=>r.classList.add('in'));
    if(en.target.id==='sFinal') runFinalType(en.target);
    cur=secs.indexOf(en.target);
    dotEls.forEach((d,i)=>d.classList.toggle('on',i===cur));
  }else{
    en.target.querySelectorAll('.rv').forEach(r=>r.classList.remove('in'));
  }
});},{threshold:.5});
secs.forEach(s=>io.observe(s));
addEventListener('scroll',()=>{const h=document.documentElement;
  prog.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';},{passive:true});
function go(d){
  if(d>0 && blockOpeningAdvance()) return;
  const n=Math.max(0,Math.min(secs.length-1,cur+d));
  secs[n].scrollIntoView({behavior:'smooth'});
}
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
let lastScreenAdvance=0;
addEventListener('click',e=>{
  if(e.defaultPrevented || e.button!==0) return;
  if(e.target.closest('a,button,input,textarea,select,label,[contenteditable="true"],.dots,.arrows,.img-upload')) return;
  const now=Date.now();
  if(now-lastScreenAdvance<700) return;
  lastScreenAdvance=now;
  go(1);
});
addEventListener('keydown',e=>{
  if(['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1);}
  if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1);}
});
</script>
